[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-extensions-gui"
dynamic = ["version"]
description = "Local web GUI for previewing and running sequence_extensions flows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Erik Rosenlund" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sequence-extensions-flow>=3.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
seq-ext-gui = "seq_ext_gui.cli:main"

[tool.setuptools.dynamic]
version = { attr = "seq_ext_gui.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seq_ext_gui = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: end-to-end tests that spawn the real worker subprocess"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
