name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # The engine is a development dependency, checked out next to this repo
      # so that `-e ../sequence_extensions` resolves.
      # Pin the revision the test suite was verified against.
      - name: Checkout sequence_extensions
        run: |
          git clone --filter=blob:none https://github.com/pyssporg/sequence_extensions.git ../sequence_extensions
          git -C ../sequence_extensions checkout 3bf6f6d9aff007fd76265a7511017aa6dad64c2d

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest
